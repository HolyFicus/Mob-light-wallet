<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background container with soft rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Subtle glow ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <!-- Wallet Body with drop shadow -->
  <g filter="url(#shadow)">
    <!-- Main Wallet Pocket -->
    <rect x="96" y="160" width="320" height="220" rx="36" fill="#ffffff" fill-opacity="0.96"/>
    
    <!-- Top folded card section -->
    <path d="M 128 160 L 128 136 C 128 118 142 104 160 104 L 352 104 C 370 104 384 118 384 136 L 384 160 Z" fill="#e0e7ff"/>

    <!-- Decorative stitch line -->
    <line x1="120" y1="200" x2="392" y2="200" stroke="#c7d2fe" stroke-width="3" stroke-dasharray="8 6"/>

    <!-- Golden Coin popping out -->
    <circle cx="256" cy="130" r="44" fill="url(#coinGrad)"/>
    <circle cx="256" cy="130" r="34" fill="none" stroke="#fef3c7" stroke-width="3"/>
    <!-- Ruble sign inside coin -->
    <text x="256" y="143" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#78350f" text-anchor="middle">₽</text>

    <!-- Wallet Flap on the right -->
    <path d="M 330 230 C 330 216 342 204 356 204 L 416 204 C 424 204 430 210 430 218 L 430 322 C 430 330 424 336 416 336 L 356 336 C 342 336 330 324 330 310 Z" fill="#6366f1"/>
    
    <!-- Flap Clasp / Button -->
    <circle cx="365" cy="270" r="15" fill="#facc15"/>
    <circle cx="365" cy="270" r="8" fill="#ca8a04"/>
  </g>
</svg>